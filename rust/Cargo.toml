[workspace]
resolver = "3"
members = ["crates/dejafix-core", "crates/dejafix"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
dejafix-core = { path = "crates/dejafix-core" }
jiff = "=0.2.43"
regex = "=1.13.1"
serde = "=1.0.229"
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
allow_attributes = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"

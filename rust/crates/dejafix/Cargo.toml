[package]
name = "dejafix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Coding agent memory: local-first memory and judgment for AI coding agents."
autobins = false

[package.metadata.dist]
dist = true

[[bin]]
name = "djf"
path = "src/main.rs"

[[bin]]
name = "dejafix"
path = "src/bin/dejafix.rs"

[[bin]]
name = "djf-mcp"
path = "src/bin/djf-mcp.rs"

[[bin]]
name = "djf-edit-hook"
path = "src/bin/djf-edit-hook.rs"

[[bench]]
name = "hooks"
harness = false

[[bench]]
name = "mcp"
harness = false

[[test]]
name = "cli"
path = "tests/cli/main.rs"

[[test]]
name = "golden"
path = "tests/golden/main.rs"

[dependencies]
clap.workspace = true
dejafix-core.workspace = true
jiff.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
assert_cmd.workspace = true
criterion.workspace = true
insta.workspace = true
dejafix-core = { workspace = true, features = ["testing"] }
regex.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "dejafix"
dynamic = ["version"]
description = "Coding agent memory: local-first memory and judgment for AI coding agents. One MCP server for every project; warns before repeating failed fixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["coding-agent-memory", "mcp", "mcp-server", "claude-code", "cursor", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/bigfree/dejafix"
Repository = "https://github.com/bigfree/dejafix"
Issues = "https://github.com/bigfree/dejafix/issues"

[tool.maturin]
bindings = "bin"
profile = "dist"
strip = true

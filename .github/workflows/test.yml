name: Test

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nextest:
    name: nextest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install dejafix 0.4 from src/ as the golden-test oracle
        run: python -m pip install -e .
      - name: Install the toolchain pinned in rust/rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Run every test
        working-directory: rust
        env:
          DEJAFIX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --workspace --all-features --no-fail-fast
  install-dist:
    name: install-dist (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install dist the way the release does
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) triple=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
            macOS-ARM64) triple=aarch64-apple-darwin ;;
            macOS-X64) triple=x86_64-apple-darwin ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ;;
            *) echo "no triple for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          bash .github/scripts/install-dist.sh "$triple"

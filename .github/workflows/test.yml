name: Test

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextest:
    name: nextest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install dejafix 0.4 from src/ as the golden-test oracle
        run: python -m pip install -e .
      - name: Install the toolchain pinned in rust/rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Run every test
        working-directory: rust
        env:
          DEJAFIX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --workspace --all-features --no-fail-fast

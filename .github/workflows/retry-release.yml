name: Retry release

# GitHub sometimes cannot find a hosted runner for a release job, most often a
# macOS arm64 one, and cancels the job after about 15 minutes. This workflow
# reruns such jobs when the release failed only because of that, until the
# release run reaches its fourth attempt. The cap counts the release run's own
# attempts, so it holds across invocations of this workflow and manual reruns.
# Any other failure is left alone.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads only the metadata of the triggering run; checks out nothing and runs no code or artifact from it
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: retry-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4 &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Rerun jobs that never got a runner
        run: |
          set -euo pipefail

          only_runner_misses() {
            local failed cancelled id
            failed=$(gh run view "$RUN_ID" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
            [ "$failed" -eq 0 ] || return 1
            cancelled=$(gh run view "$RUN_ID" --json jobs \
              --jq '.jobs[] | select(.conclusion == "cancelled") | .databaseId')
            [ -n "$cancelled" ] || return 1
            for id in $cancelled; do
              gh api "repos/$GH_REPO/check-runs/$id/annotations" --jq '.[].message' \
                | grep -q "not acquired by Runner" || return 1
            done
          }

          max_attempts=4
          while :; do
            if ! only_runner_misses; then
              echo "The release did not fail only on missing runners; nothing to retry."
              exit 0
            fi
            attempt=$(gh run view "$RUN_ID" --json attempt --jq .attempt)
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::The release still had no runner after $attempt attempts."
              exit 1
            fi
            echo "Waiting 10 minutes before attempt $((attempt + 1)) of $max_attempts."
            sleep 600
            gh run rerun "$RUN_ID" --failed
            sleep 30
            while :; do
              status=$(gh run view "$RUN_ID" --json status --jq .status)
              case "$status" in
                completed | waiting) break ;;
              esac
              sleep 60
            done
            if [ "$status" = waiting ]; then
              echo "The release is waiting for an approval."
              exit 0
            fi
            if [ "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success ]; then
              echo "The release succeeded on attempt $((attempt + 1))."
              exit 0
            fi
          done
